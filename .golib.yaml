manifest:
  modules: modules.json
  packages: packages.json
evidence:
  root: .verification
mutation:
  root: .verification/mutation
  imports:
    - module: .
      archive: .verification/mutation/bootstrap/root.zip
      ledger: .verification/mutation/migration-ledger.json
    - module: adapters/gotelemetry
      archive: .verification/mutation/bootstrap/adapters-gotelemetry.zip
      ledger: .verification/mutation/migration-ledger.json
    - module: adapters/mskiam
