    - module: kafkaservice
      archive: .verification/mutation/bootstrap/kafkaservice.zip
      ledger: .verification/mutation/migration-ledger.json
api:
  baselines:
    - module: .
      mode: apidiff
      path: api/baseline.txt
    - module: adapters/gotelemetry
      mode: apidiff
      path: adapters/gotelemetry/api/baseline.txt
    - module: adapters/mskiam
      mode: apidiff
      path: adapters/mskiam/api/baseline.txt
    - module: kafkaservice
      mode: apidiff
      path: kafkaservice/api/baseline.txt
